<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SUPER JACKPOT ROULETTE WIN EXTRA BIG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cinzel:wght@400;600;800;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-name">Super Jackpot Roulette <em>Win Extra Big</em></span> <span class="tag">play money only</span></div>
    <div class="wallet">
      <div class="stat"><span>Balance</span><strong id="balance">$0</strong></div>
      <div class="stat"><span>On table</span><strong id="onTable">$0</strong></div>
      <div class="stat"><span>Session</span><strong id="session">$0</strong></div>
      <button type="button" id="walletBtn" class="stat wallet-stat" title="Your wallet: the store only takes wallet money. Tap to open the Bank on your phone."><span>👛 Wallet</span><strong id="walletAmt">$0</strong></button>
      <button type="button" id="lvlChip" class="lvl-chip"><b>1</b></button>
      <button id="drinksBtn" class="btn drinks-btn" title="Drinks menu &amp; VIP bottle service">🍾 Drinks</button>
      <button id="adBtn" class="btn ad-btn" hidden title="Broke? Watch a totally real ad for $100">📺 Watch ad: +$100</button>
      <button id="phoneBtn" class="btn phone-btn" title="Your phone (P): map, bank, store, your style, goals, settings" aria-label="Open your phone">📱 <span>Phone</span><b class="ph-badge"></b></button>
    </div>
  </header>

  <main>
    <section class="stage">
      <div id="wheel"></div>
      <div class="history" id="history" aria-label="Recent numbers"></div>
      <div class="result" id="result" aria-live="polite"></div>
    </section>

    <section class="table-area">
      <div class="table-layout">
        <div class="board-wrap">
          <div class="board" id="board"></div>
        </div>
        <aside class="rack" id="rack" aria-label="Your chips">
          <div class="rack-head"><span>Your chips</span><strong id="rackTotal">$0</strong></div>
          <div class="rack-cols" id="rackCols"></div>
          <div class="rack-hint">Pick a stack to bet with</div>
        </aside>
      </div>
      <div class="controls">
        <button id="allInBtn" class="allin" type="button" title="ALL IN: your next spot gets every chip you have" aria-pressed="false">
          <span>ALL<br>IN</span>
        </button>
        <div class="actions">
          <button id="undoBtn" class="btn">Undo</button>
          <button id="clearBtn" class="btn">Clear</button>
          <button id="rebetBtn" class="btn">Rebet</button>
          <button id="doubleBtn" class="btn">×2</button>
          <button id="spinBtn" class="btn spin">SPIN</button>
        </div>
      </div>
      <p class="hint">
        <span class="hint-desktop">Click a spot to drop the selected chip · Right-click to take it back · Space to spin</span>
        <span class="hint-touch">Tap a spot or a line to bet · Undo takes the last chip back</span>
      </p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" popover="manual"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
